<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bella — Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="admin-body"><main class="admin-shell"><section class="admin-login panel" id="login-panel"><a class="brand" href="index.html">bella<span>.</span></a><p class="eyebrow">STAFF ACCESS</p><h1>Welcome back.</h1><p>Sign in to manage orders and payment reviews.</p><form id="login-form"><label class="form-group">Username<input id="username" autocomplete="username" required></label><label class="form-group">Password<input id="password" type="password" autocomplete="current-password" required></label><button class="button button-dark full-button" type="submit">Sign in <span>→</span></button><p id="login-error" class="form-error" role="alert"></p></form></section>
<section class="admin-app hidden" id="admin-app"><header class="admin-top"><a class="brand" href="index.html">bella<span>.</span> <small>ADMIN</small></a><div><span id="admin-name"></span><button class="text-button" id="logout-button">Sign out</button></div></header><div class="admin-welcome"><div><p class="eyebrow">BELLA CONTROL ROOM</p><h1>Good work, <em id="welcome-name">team.</em></h1></div><button class="button button-dark" id="refresh-button" type="button">Refresh data ↻</button></div><div class="admin-stats" id="admin-stats"></div><div class="admin-tabs"><button class="admin-tab active" data-panel="payments-panel">Payment review <span id="pending-count">0</span></button><button class="admin-tab" data-panel="orders-panel">All orders</button></div><section id="payments-panel" class="admin-panel"><div class="admin-panel-head"><div><h2>Pending payments</h2><p>Check each receipt before confirming the order.</p></div></div><div id="payments-list" class="admin-list"></div></section><section id="orders-panel" class="admin-panel hidden"><div class="admin-panel-head"><div><h2>All orders</h2><p>Recent orders and their current status.</p></div></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Placed</th></tr></thead><tbody id="orders-list"></tbody></table></div><button class="button button-light hidden" id="load-more" type="button">Load more orders</button></section></section></main><div class="toast" id="toast" role="status"></div><script src="js/products.js"></script><script src="js/admin.js"></script></body></html>
