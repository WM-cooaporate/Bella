services:
  - type: web
    name: bella-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/products
    disk:
      name: bella-private-uploads
      mountPath: /var/lib/bella
      sizeGB: 1
    envVars:
      - key: BELLA_STORAGE_PATH
        value: /var/lib/bella
      - key: DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BELLA_ADMIN_USERNAME
        sync: false
      - key: BELLA_ADMIN_PASSWORD
        sync: false
      - key: BELLA_CORS_ORIGIN
        sync: false
