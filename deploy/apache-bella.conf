<VirtualHost *:80>
    DocumentRoot /var/www/html
    Alias /backend/public/ /var/www/backend/public/

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/backend/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/backend>
        Require all denied
    </Directory>

    <Directory /var/lib/bella>
        Require all denied
    </Directory>


    ErrorLog ${APACHE_LOG_DIR}/bella-error.log
    CustomLog ${APACHE_LOG_DIR}/bella-access.log combined
</VirtualHost>
